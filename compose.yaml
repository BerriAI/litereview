services:
  app:
    build: .
    ports: ['8000:8000']
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://litereview:local-dev-only@db:5432/litereview
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litereview
      POSTGRES_USER: litereview
      POSTGRES_PASSWORD: local-dev-only
    volumes: ['database:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U litereview']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database:
