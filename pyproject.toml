[project]
name = "litereview"
version = "0.1.0"
description = "Independent, configurable PR reviewers in Modal"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "cryptography>=44", "PyJWT>=2.10,<3", "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.20", "modal>=1.1,<2", "litellm>=1.80,<2",
  "mcp>=1.30,<2", "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "playwright>=1.51"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
