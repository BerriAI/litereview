services:
  - type: web
    name: litereview
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: litereview-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_USERS
        sync: false
      - key: GOOGLE_SSO_REQUIRED
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        value: berri.ai
      - key: GITHUB_ORGANIZATION
        value: BerriAI
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: MODAL_APP_NAME
        value: litereview
      - key: CONCURRENCY
        value: "0"
      - key: MAX_REVIEW_MINUTES
        value: "120"
databases:
  - name: litereview-db
    plan: basic-256mb
    region: oregon
    databaseName: litereview
    user: litereview
    ipAllowList: []
